<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
.frame { width:1080px; height:1080px; display:grid; place-items:center; }
.disc { position:relative; z-index:3; width:920px; height:920px; border-radius:50%; background:var(--ivory); color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:0 0 0 16px var(--gold), 0 0 0 34px var(--crimson), 0 0 0 38px var(--gold-d), 0 40px 100px rgba(0,0,0,.5); }
.disc img { width:120px; height:120px; border-radius:50%; background:#fff; padding:4px; box-shadow:0 0 0 4px var(--gold); }
.e { font-size:34px; color:var(--red); margin-top:28px; }
.t1 { font-size:160px; margin-top:6px; color:var(--crimson); }
.t2 { font-size:150px; color:var(--red); }
.d { font-family:"Barlow Condensed"; font-weight:800; font-size:38px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink); margin-top:26px; }
.d span { color:var(--gold-d); }
</style></head><body>
<div class="frame">
  <div class="grain"></div>
  <div class="disc">
    <img src="emblem.png" alt="">
    <div class="label e">I’m attending</div>
    <h1 class="display t1">Shiloh 2026</h1>
    <h2 class="display t2">Far Above</h2>
    <div class="d">Lincoln <span>·</span> 8 to 13 Dec</div>
  </div>
</div>
</body></html>
