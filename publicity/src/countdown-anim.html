<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
/* Animated countdown for a service day. Five designs (v=1..5) so the run-up never looks the same twice.
   Params: n (days left), d (date, "8 November"), s (service name), v (design), w, h (frame size). Every design
   loops cleanly at 4 seconds: entrances finish by ~2s and anything that keeps moving has a period that divides 4. */
.grain { display:none; }
.frame { width:var(--w); height:var(--h); }
.emblem img { width:56px; height:56px; } .emblem b { font-size:20px; } .emblem span { font-size:14px; margin-top:3px; }
.bar { position:absolute; left:48px; right:48px; top:40px; z-index:5; }
.tag { font-size:17px; padding:9px 14px; }
.sq .bar { left:40px; right:40px; top:34px; }
.when { position:absolute; left:48px; bottom:34px; z-index:5; font-size:22px; line-height:1.3; }
.when b { display:block; font-family:"Barlow Condensed"; font-weight:800; font-size:26px; letter-spacing:.04em; text-transform:uppercase; }
.sq .when { left:40px; bottom:28px; }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes drop { from { opacity:0; transform:translateY(-70%); } to { opacity:1; transform:none; } }
@keyframes inR { from { opacity:0; transform:translateX(120px); } to { opacity:1; transform:none; } }
@keyframes inL { from { opacity:0; transform:translateX(-120px); } to { opacity:1; transform:none; } }
@keyframes up { from { opacity:0; transform:translateY(60px); } to { opacity:1; transform:none; } }
@keyframes pop { from { opacity:0; transform:scale(.5); } to { opacity:1; transform:none; } }
@keyframes marquee { from { transform:translateX(0); } to { transform:translateX(-50%); } }
@keyframes draw { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@keyframes blink { 0%, 49% { opacity:1; } 50%, 100% { opacity:.15; } }
@keyframes sway { from { transform:rotate(-6deg); } to { transform:rotate(6deg); } }
@keyframes fill { from { background:transparent; color:rgba(246,235,214,.55); transform:scale(.8); } to { background:var(--gold); color:var(--crimson2); transform:none; } }
@keyframes flipTop { from { transform:rotateX(0); } to { transform:rotateX(-90deg); } }
@keyframes flipBot { from { transform:rotateX(90deg); } to { transform:rotateX(0); } }

/* 1 · Giant number on ivory, with a running crimson strip. */
.v1 .tag { color:var(--red); }
.v1 .big { position:absolute; left:40px; bottom:150px; display:flex; align-items:flex-end; gap:34px; }
.v1 .n { font-size:470px; line-height:.8; color:var(--crimson); text-shadow:14px 14px 0 var(--gold); letter-spacing:-.02em; animation: drop .9s cubic-bezier(.34,1.56,.64,1) .2s both; }
.v1 .togo { display:flex; flex-direction:column; padding-bottom:12px; animation: inR .7s cubic-bezier(.2,.8,.2,1) .9s both; }
.v1 .togo .display { font-size:150px; line-height:.86; color:var(--red); } .v1 .togo .display + .display { color:var(--crimson); }
.v1 .strip { position:absolute; left:0; right:0; bottom:0; height:84px; background:var(--crimson); color:var(--cream); overflow:hidden; display:flex; align-items:center; }
.v1 .m { display:flex; white-space:nowrap; animation: marquee 4s linear infinite; }
.v1 .m span { font-family:"Barlow Condensed"; font-weight:600; font-size:30px; letter-spacing:.22em; text-transform:uppercase; padding-right:1em; }
.v1 .m span i { color:var(--gold-l); font-style:normal; padding:0 .7em; }
.v1 .when { bottom:104px; left:auto; right:48px; text-align:right; color:var(--ink); animation: fade .6s ease-out 1.5s both; } .v1 .when b { color:var(--red); }
.v1.sq .big { left:40px; bottom:180px; flex-direction:column; align-items:flex-start; gap:8px; }
.v1.sq .n { font-size:300px; }
.v1.sq .togo { flex-direction:row; gap:24px; } .v1.sq .togo .display { font-size:96px; }
.v1.sq .when { left:40px; right:40px; bottom:100px; text-align:left; }

/* 2 · Calendar grid on crimson: a square a day, gold for the days already gone. */
.v2 .tag { color:var(--gold-l); } .v2 .emblem span { color:var(--gold-l); }
.v2 .grid { position:absolute; left:48px; top:150px; display:grid; grid-template-columns:repeat(6, 76px); gap:10px; }
.v2 .c { width:76px; height:76px; border:2px solid rgba(246,235,214,.35); border-radius:4px; display:grid; place-items:center; font-family:"Barlow Condensed"; font-weight:800; font-size:30px; color:rgba(246,235,214,.55); position:relative; }
.v2 .c small { position:absolute; left:6px; top:4px; font-size:11px; letter-spacing:.1em; font-weight:600; }
.v2 .c.gone { animation: fill .35s ease-out both; border-color:var(--gold); }
.v2 .c.next { border-color:var(--red); color:var(--cream); animation: blink 1s steps(1) infinite; }
.v2 .cap { position:absolute; left:48px; top:590px; font-size:17px; color:rgba(246,235,214,.6); letter-spacing:.2em; animation: fade .6s 1.6s both; }
.v2 .side { position:absolute; right:48px; top:150px; width:620px; }
.v2 .n { font-size:360px; line-height:.82; color:var(--gold-l); animation: pop .6s cubic-bezier(.34,1.56,.64,1) 1.6s both; }
.v2 .left { font-size:82px; color:var(--cream); margin-top:14px; animation: up .6s cubic-bezier(.2,.8,.2,1) 1.9s both; }
.v2 .when { color:var(--cream); animation: fade .6s 2.2s both; } .v2 .when b { color:var(--gold-l); }
.v2.sq .grid { top:130px; left:40px; grid-template-columns:repeat(10, 56px); gap:8px; }
.v2.sq .c { width:56px; height:56px; font-size:22px; } .v2.sq .c small { display:none; }
.v2.sq .cap { top:332px; left:40px; font-size:15px; }
.v2.sq .side { left:40px; right:40px; top:370px; width:auto; display:flex; align-items:flex-end; gap:30px; }
.v2.sq .n { font-size:240px; } .v2.sq .left { font-size:60px; margin-bottom:18px; }
.v2.sq .when { left:auto; right:40px; text-align:right; }

/* 3 · Flip clock on deep crimson. */
.v3 { background:linear-gradient(180deg, var(--crimson2), #24020a); }
.v3 .tag { color:var(--gold-l); } .v3 .emblem span { color:var(--gold-l); }
.v3 .clock { position:absolute; left:0; right:0; top:170px; display:flex; justify-content:center; align-items:center; gap:34px; }
.v3 .card { position:relative; width:300px; height:400px; perspective:1400px; filter:drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
.v3 .half { position:absolute; left:0; right:0; height:50%; overflow:hidden; background:var(--ivory); backface-visibility:hidden; }
.v3 .half.top { top:0; border-radius:14px 14px 0 0; } .v3 .half.bot { bottom:0; border-radius:0 0 14px 14px; background:var(--ivory2); }
.v3 .half span { position:absolute; left:0; right:0; height:400px; font-family:"Anton"; font-size:360px; line-height:400px; text-align:center; color:var(--crimson); }
.v3 .half.top span { top:0; } .v3 .half.bot span { top:-200px; }
.v3 .flip-top { transform-origin:50% 100%; animation: flipTop .4s ease-in 1s forwards; z-index:2; }
.v3 .flip-bot { transform-origin:50% 0; transform:rotateX(90deg); animation: flipBot .4s ease-out 1.4s forwards; z-index:2; }
.v3 .hinge { position:absolute; left:0; right:0; top:calc(50% - 2px); height:4px; background:rgba(27,6,8,.55); z-index:3; }
.v3 .dots { display:flex; flex-direction:column; gap:40px; animation: blink 1s steps(1) infinite; }
.v3 .dots i { width:26px; height:26px; border-radius:50%; background:var(--gold); display:block; }
.v3 .lbl { position:absolute; left:0; right:0; top:596px; text-align:center; font-size:26px; color:var(--gold-l); animation: fade .6s .4s both; }
.v3 .when { left:auto; right:48px; text-align:right; color:var(--cream); animation: fade .6s 1.8s both; } .v3 .when b { color:var(--gold-l); }
.v3.sq .clock { top:150px; gap:24px; } .v3.sq .card { width:230px; height:310px; } .v3.sq .half span { height:310px; font-size:280px; line-height:310px; } .v3.sq .half.bot span { top:-155px; }
.v3.sq .dots i { width:20px; height:20px; } .v3.sq .dots { gap:30px; }
.v3.sq .lbl { top:490px; } .v3.sq .when { left:40px; right:40px; text-align:left; bottom:100px; }

/* 4 · Papa and a swaying seal on gold. */
.v4 .tag { color:var(--crimson2); }
.v4 .papa { left:-70px; bottom:0; width:500px; height:660px; background-size:1340px auto; background-position:-810px -60px;
  -webkit-mask-image:radial-gradient(ellipse 46% 125% at 50% 100%, #000 45%, transparent 96%); mask-image:radial-gradient(ellipse 46% 125% at 50% 100%, #000 45%, transparent 96%); animation: up 1s cubic-bezier(.2,.8,.2,1) .1s both; }
.v4 .sealwrap { position:absolute; right:70px; top:150px; width:420px; height:420px; animation: pop .8s cubic-bezier(.34,1.56,.64,1) .5s both; }
.v4 .sealwrap svg { position:absolute; inset:0; animation: sway 2s ease-in-out infinite alternate; }
.v4 .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.v4 .mid .n { font-size:190px; line-height:.85; color:var(--crimson); animation: pop .5s cubic-bezier(.34,1.56,.64,1) 1.1s both; }
.v4 .mid .label { font-size:26px; color:var(--red); margin-top:8px; animation: fade .5s 1.5s both; }
.v4 .head { position:absolute; left:440px; right:510px; top:170px; }
.v4 h2 { font-size:31px; line-height:1.2; color:var(--crimson2); margin:0; animation: inL .8s cubic-bezier(.2,.8,.2,1) 1.2s both; }
.v4 .h2b { font-size:38px; color:var(--red); margin-top:12px; animation: inL .8s cubic-bezier(.2,.8,.2,1) 1.6s both; }
.v4 .when { left:auto; right:48px; text-align:right; color:var(--crimson2); animation: fade .6s 2s both; } .v4 .when b { color:var(--red); }
.v4.sq .papa { left:-70px; width:430px; height:540px; background-size:1120px auto; background-position:-680px -40px; }
.v4.sq .sealwrap { right:28px; top:104px; width:330px; height:330px; } .v4.sq .mid .n { font-size:150px; } .v4.sq .mid .label { font-size:20px; }
.v4.sq .head { left:370px; right:40px; top:462px; } .v4.sq h2 { font-size:23px; } .v4.sq .h2b { font-size:31px; margin-top:8px; }
.v4.sq .when { left:auto; right:40px; }

/* 5 · The number in words, stacked in three typefaces, on red. */
.v5 .tag { color:var(--cream); }
.v5 .stack { position:absolute; left:48px; top:150px; }
.v5 .w1 { font-size:210px; line-height:.86; color:var(--cream); animation: inL .8s cubic-bezier(.2,.8,.2,1) .2s both; }
.v5 .w2 { font-size:150px; line-height:1; color:var(--gold-l); margin-top:-6px; animation: inR .8s cubic-bezier(.2,.8,.2,1) .6s both; }
.v5 .w3 { font-size:110px; color:var(--crimson2); margin-top:10px; animation: inL .8s cubic-bezier(.2,.8,.2,1) 1s both; }
.v5 .rule { position:absolute; left:48px; right:48px; bottom:118px; height:3px; background:var(--gold-l); transform-origin:0 50%; animation: draw .8s cubic-bezier(.2,.8,.2,1) 1.3s both; }
.v5 .num { position:absolute; right:48px; top:150px; width:230px; height:230px; border-radius:50%; background:var(--ivory); color:var(--red); display:grid; place-items:center; font-size:150px; line-height:1; animation: pop .6s cubic-bezier(.34,1.56,.64,1) 1.6s both; }
.v5 .num small { position:absolute; bottom:30px; font-family:"Barlow Condensed"; font-weight:800; font-size:18px; letter-spacing:.2em; }
.v5 .when { color:var(--cream); animation: fade .6s 2s both; } .v5 .when b { color:var(--gold-l); }
.v5 .note { position:absolute; right:48px; bottom:34px; font-size:30px; color:var(--cream); text-align:right; animation: fade .6s 2.2s both; max-width:560px; line-height:1.2; }
.v5.sq .stack { left:40px; top:130px; } .v5.sq .w1 { font-size:150px; } .v5.sq .w2 { font-size:110px; } .v5.sq .w3 { font-size:80px; }
.v5.sq .num { right:40px; top:auto; bottom:130px; width:170px; height:170px; font-size:110px; } .v5.sq .num small { bottom:22px; font-size:14px; }
.v5.sq .rule { left:40px; right:40px; bottom:110px; }
.v5.sq .note { display:none; }
.v5.sq .when { left:40px; bottom:28px; }

/* Story (9:16) for WhatsApp status and Instagram stories: 540×960, rendered at 2× for the MP4. The bar stacks
   so the lockup and the service tag each get a full line; everything else re-flows into one column. */
.st .bar { left:32px; right:32px; top:30px; flex-direction:column; align-items:flex-start; gap:14px; }
.st .emblem img { width:46px; height:46px; } .st .emblem b { font-size:17px; } .st .emblem span { font-size:12px; margin-top:3px; }
.st .tag { font-size:14px; padding:8px 12px; }
.st .when { left:32px; right:32px; bottom:30px; font-size:18px; } .st .when b { font-size:22px; }
.v1.st .big { left:32px; right:32px; top:200px; bottom:auto; flex-direction:column; align-items:flex-start; gap:6px; }
.v1.st .n { font-size:440px; text-shadow:12px 12px 0 var(--gold); }
.v1.st .togo { flex-direction:column; gap:0; padding-bottom:0; } .v1.st .togo .display { font-size:120px; }
.v1.st .when { left:32px; right:32px; bottom:88px; text-align:left; }
.v1.st .strip { height:64px; } .v1.st .m span { font-size:22px; }
.v2.st .grid { left:40px; top:160px; grid-template-columns:repeat(6, 70px); gap:8px; }
.v2.st .c { width:70px; height:70px; font-size:26px; } .v2.st .c small { font-size:10px; left:5px; top:3px; }
.v2.st .cap { left:40px; top:556px; font-size:13px; letter-spacing:.16em; }
.v2.st .side { left:32px; right:32px; top:600px; width:auto; display:flex; align-items:flex-end; gap:20px; }
.v2.st .n { font-size:230px; } .v2.st .left { font-size:60px; margin-top:0; margin-bottom:16px; }
.v2.st .when { left:32px; right:32px; bottom:30px; }
.v3.st .clock { top:330px; gap:16px; } .v3.st .card { width:214px; height:290px; } .v3.st .half span { height:290px; font-size:260px; line-height:290px; } .v3.st .half.bot span { top:-145px; }
.v3.st .dots { gap:26px; } .v3.st .dots i { width:16px; height:16px; }
.v3.st .lbl { top:655px; font-size:22px; } .v3.st .when { left:32px; right:32px; text-align:left; bottom:30px; }
.v4.st .sealwrap { left:155px; right:auto; top:135px; width:230px; height:230px; } .v4.st .mid .n { font-size:104px; } .v4.st .mid .label { font-size:15px; margin-top:4px; }
.v4.st .head { left:32px; right:32px; top:388px; text-align:center; }
.v4.st h2 { font-size:21px; } .v4.st .h2b { font-size:30px; margin-top:8px; }
.v4.st .papa { left:50px; width:440px; height:390px; bottom:84px; background-size:1300px auto; background-position:-800px -290px; }
.v4.st .when { left:0; right:0; bottom:0; padding:16px 32px; background:var(--crimson2); color:var(--cream); text-align:left; } .v4.st .when b { color:var(--gold-l); }
.v5.st .stack { left:32px; top:160px; } .v5.st .w1 { font-size:150px; } .v5.st.long .w1 { font-size:112px; } .v5.st .w2 { font-size:112px; } .v5.st .w3 { font-size:84px; }
.v5.st .num { right:32px; top:auto; bottom:150px; width:190px; height:190px; font-size:120px; } .v5.st .num small { bottom:24px; font-size:15px; }
.v5.st .rule { left:32px; right:32px; bottom:118px; }
.v5.st .note { display:block; left:32px; right:240px; bottom:150px; text-align:left; font-size:22px; max-width:none; }
.v5.st .when { left:32px; right:32px; bottom:30px; }
.v5.sq.zero .w3, .v5.st.zero .w3 { font-size:56px; }
</style></head><body>
<div id="root" class="frame"></div>
<script>
const n = +P("n", "7"), date = P("d", "8 November"), svc = P("s", ""), W = +P("w", "1280"), H = +P("h", "720");
const v = n === 0 ? 5 : +P("v", "1"); // the opening day always uses the words design, which carries "It starts tonight"
document.documentElement.style.setProperty("--w", W + "px"); document.documentElement.style.setProperty("--h", H + "px");
const root = document.getElementById("root");
root.className = "frame v" + v + (W > H ? " wide" : W === H ? " sq" : " st") + (v === 1 ? " ivory" : v === 4 ? " gold" : v === 5 ? " red" : "");
const WORDS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const words = k => k <= 20 ? WORDS[k] : "twenty" + (k % 10 ? " " + WORDS[k % 10] : "");
if (n === 0) root.classList.add("zero");
if (n === 0 || Math.max(...words(n).split(" ").map(w => w.length)) >= 7) root.classList.add("long"); // "thirteen" needs a smaller size in the story column
const bar = `<div class="bar"><div class="emblem"><img src="logo.png" alt=""><div><b>Winners Chapel International</b><span>Lincoln</span></div></div><span class="tag">${svc ? svc + " · " : ""}${date}</span></div>`;
const when = `<div class="when"><b>Shiloh 2026 · Far Above</b>Opens Tuesday 8 December, 5:00 PM · Moorland Community Centre</div>`;
const days = n === 1 ? "day" : "days";
const V = {
  1: () => `${bar}<div class="big"><div class="display n">${n}</div><div class="togo"><div class="display">${days}</div><div class="display">to go</div></div></div>${when}
    <div class="strip"><div class="m">${"<span>Shiloh 2026<i>·</i>Far Above<i>·</i>Tue 8 to Sun 13 December<i>·</i>Live in Lincoln<i>·</i>Every session, all six days<i>·</i></span>".repeat(2)}</div></div>`,
  2: () => {
    const gone = 30 - n, cells = [];
    for (let i = 0; i < 30; i++) { const day = i < 23 ? 8 + i : i - 22; const cls = i < gone ? "gone" : i === gone ? "next" : "";
      cells.push(`<div class="c ${cls}" style="animation-delay:${cls === "gone" ? (.2 + i * .045).toFixed(3) + "s" : ""}">${i === 0 || i === 23 ? `<small>${i < 23 ? "Nov" : "Dec"}</small>` : ""}${day}</div>`); }
    return `${bar}<div class="grid">${cells.join("")}</div><div class="label cap">8 November to 7 December · one square a day</div>
      <div class="side"><div class="display n">${n}</div><div class="display left">${days} left</div></div>${when}`;
  },
  3: () => {
    const to = String(n).padStart(2, "0"), from = String(n + 1).padStart(2, "0");
    const card = i => { const a = from[i], b = to[i]; if (a === b) return `<div class="card"><div class="half top"><span>${b}</span></div><div class="half bot"><span>${b}</span></div><div class="hinge"></div></div>`;
      return `<div class="card"><div class="half top"><span>${b}</span></div><div class="half bot"><span>${a}</span></div><div class="half top flip-top"><span>${a}</span></div><div class="half bot flip-bot"><span>${b}</span></div><div class="hinge"></div></div>`; };
    return `${bar}<div class="clock">${card(0)}<div class="dots"><i></i><i></i></div>${card(1)}</div><div class="label lbl">${days} to Shiloh 2026</div>${when}`;
  },
  4: () => `${bar}<div class="papa"></div><div class="sealwrap"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="98" fill="#F6EBD6" stroke="#5B0B13" stroke-width="3"/><circle cx="100" cy="100" r="72" fill="none" stroke="#B3141E" stroke-width="1.5" stroke-dasharray="2 3"/><defs><path id="sp" d="M100,100 m-86,0 a86,86 0 1,1 172,0 a86,86 0 1,1 -172,0"/></defs><text font-family="Barlow Condensed" font-weight="800" font-size="16.5" letter-spacing="2.4" fill="#5B0B13"><textPath href="#sp">${days.toUpperCase()} TO SHILOH 2026 · LIVE IN LINCOLN · FAR ABOVE · </textPath></text></svg><div class="mid"><div class="display n">${n}</div><div class="label">${days} to go</div></div></div>
    <div class="head"><h2 class="serif">“Far above all principality, and power, and might, and dominion.”</h2><div class="cond h2b">Shiloh is coming to Lincoln.</div></div>${when}`,
  5: () => { if (n === 0) return `${bar}<div class="stack"><div class="display w1">It starts<br>tonight</div><div class="serif w2">5:00 PM</div><div class="cond w3">Encounter Night</div></div><div class="rule"></div>
    <div class="display num">8<small>Dec</small></div><div class="serif note">Opening night. Come expecting, and bring someone with you.</div>${when}`;
    const w = words(n).split(" "); return `${bar}<div class="stack"><div class="display w1">${w.join("<br>")}</div><div class="serif w2">${days}</div><div class="cond w3">to go</div></div><div class="rule"></div>
    <div class="display num">${n}<small>${days}</small></div><div class="serif note">${n <= 2 ? "Tuesday, 5:00 PM. Be there, and bring someone." : "Clear the week. Every session, all six days."}</div>${when}`; },
};
root.innerHTML = V[v]();
</script>
</body></html>
