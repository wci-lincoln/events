<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
.frame { width:1080px; height:1920px; }
.top { padding:80px 80px 0; height:1200px; display:flex; flex-direction:column; }
.kick { font-size:30px; color:var(--red); margin-top:100px; }
.n { font-family:"Anton"; font-size:600px; line-height:.82; color:var(--crimson); margin-top:20px; letter-spacing:-.01em; text-shadow:14px 14px 0 var(--gold); }
.n.today { font-size:250px; line-height:.9; text-shadow:8px 8px 0 var(--gold); }
.w { font-size:150px; color:var(--red); margin-top:30px; }
.sub { font-size:40px; margin-top:auto; color:var(--ink); line-height:1.3; max-width:900px; }
.sub b { color:var(--red); font-weight:700; }
.band { position:absolute; left:0; right:0; bottom:0; height:720px; background:linear-gradient(180deg, var(--crimson), var(--crimson2)); color:var(--cream); padding:70px 80px 80px; display:flex; flex-direction:column; }
.glow { width:900px; height:900px; right:-250px; bottom:-200px; }
.papa { right:-60px; bottom:0; width:600px; height:700px; background-size:1640px auto; background-position:-1040px -195px;
  -webkit-mask-image:radial-gradient(ellipse 46% 125% at 50% 100%, #000 45%, transparent 96%); mask-image:radial-gradient(ellipse 46% 125% at 50% 100%, #000 45%, transparent 96%); }
.dates { font-size:52px; } .venue { font-size:26px; margin-top:12px; opacity:.85; line-height:1.3; }
.foot { margin-top:auto; display:flex; align-items:center; gap:30px; position:relative; z-index:3; }
.qr { width:250px; height:250px; flex:none; }
.foot .cta { font-size:40px; color:var(--gold-l); } .foot .sub2 { font-size:25px; margin-top:10px; line-height:1.3; opacity:.85; max-width:420px; }
.seal { right:80px; top:290px; }
</style></head><body>
<div class="frame ivory">
  <div class="grain"></div>
  <div class="top"><div class="bar"><div class="emblem"><img src="emblem.png" alt=""><div><b>Winners Chapel International</b><span>Lincoln</span></div></div><span class="tag">Viewing centre</span></div><div class="label kick">Shiloh 2026 · Far Above · Lincoln</div><div id="big"></div><div class="sub" id="sub"></div></div>
  <div class="seal" data-seal="200"></div><div class="band"><div class="glow"></div><div class="papa"></div>
    <div class="cond dates">Tue 8 – Sun 13 December</div><div class="venue">Moorland Community Centre<br>Moorland Avenue, Lincoln LN6 7NH</div>
    <div class="foot"><div class="qr"><img src="qr.svg" alt=""></div><div><div class="cond cta">Plan your week</div><div class="sub2">Free transport, classes, what to bring.</div></div></div>
  </div>
</div>
<script>
const n=+P("n","7"); const big=document.getElementById("big"), sub=document.getElementById("sub");
if(n===0){ big.innerHTML='<div class="n today">It starts<br>tonight</div>'; sub.innerHTML='Opening <b>Encounter Night, 5:00 PM</b>. Come expecting, and bring someone with you.'; }
else { big.innerHTML='<div class="n">'+n+'</div><div class="display w">'+(n===1?'day':'days')+' to go</div>'; sub.innerHTML='Shiloh 2026 opens <b>Tuesday 8 December, 5:00 PM</b>, here in Lincoln. Six days. Every session. Bring someone.'; }
</script>
</body></html>
