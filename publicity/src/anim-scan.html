<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
.grain { display:none; }
.frame { width:540px; height:960px; }
.top { padding:40px 40px 0; height:300px; }
.emblem { justify-content:flex-start; } .emblem img { width:44px; height:44px; } .emblem b { font-size:16px; } .emblem span { font-size:12px; margin-top:3px; }
.t1 { font-size:96px; margin-top:34px; color:var(--cream); } .t1 span { color:var(--gold-l); }
.t2 { font-size:22px; color:var(--gold-l); margin-top:10px; }
.bottom { position:absolute; left:0; right:0; bottom:0; height:640px; padding:50px 40px 40px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.wrap { position:relative; width:320px; height:320px; display:grid; place-items:center; }
.ring { position:absolute; inset:0; border-radius:14px; border:3px solid var(--red); animation: pulse 1.5s ease-out infinite; }
.ring.b { animation-delay:.75s; }
@keyframes pulse { from { transform:scale(1); opacity:.9; } to { transform:scale(1.3); opacity:0; } }
.qr { width:320px; height:320px; position:relative; padding:22px; }
.cta { font-size:60px; color:var(--crimson); margin-top:40px; animation: tick .75s steps(2) infinite alternate; }
@keyframes tick { from { color:var(--crimson); } to { color:var(--red); } }
.sub { font-size:21px; color:rgba(27,6,8,.78); line-height:1.3; margin-top:10px; max-width:420px; }
.arrow { width:40px; margin-top:auto; animation: bounce .75s ease-in-out infinite alternate; }
@keyframes bounce { from { transform:translateY(-8px); } to { transform:translateY(8px); } }
.seal { right:30px; top:-80px; }
</style></head><body>
<div class="frame"><div class="grain"></div>
  <div class="top"><div class="emblem"><img src="logo.png" alt=""><div><b>Winners Chapel International</b><span>Lincoln</span></div></div><h1 class="display t1">Shiloh <span>2026</span></h1><div class="label t2">Far Above · 8 to 13 December</div></div>
  <div class="panel bottom"><div class="seal" data-seal="160"></div><div class="wrap"><div class="ring"></div><div class="ring b"></div><div class="qr"><img src="qr.svg" alt=""></div></div><div class="display cta">Scan me</div><div class="sub">Programme, free transport, classes, T-shirts, volunteering. Everything about Shiloh in Lincoln.</div><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#B3141E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></div>
</div>
</body></html>
